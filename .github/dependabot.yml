version: 2
updates:
  # Go dependencies. Spindle links a cryptographic stack, so these updates are
  # security-relevant rather than housekeeping.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      # `include: "scope"` is deliberately absent. It appends "(deps)" to the
      # prefix, so pairing it with a prefix that already carries a scope yields
      # "chore(deps)(deps):" — a double scope that is not valid Conventional
      # Commits and that semantic-release's analyser may fail to parse.
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      # See the note above: the scope lives in the prefix, not in `include`.
      prefix: "chore(ci)"
